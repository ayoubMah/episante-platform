global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:9094']

  - job_name: 'doctor-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['doctor-service:9092']

  - job_name: 'patient-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['patient-service:9091']

  - job_name: 'appointment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['appointment-service:9093']

  - job_name: 'ingest-wearables-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ingest-wearables-service:9096']

  - job_name: 'health-alert-engine'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['health-alert-engine:9097']
