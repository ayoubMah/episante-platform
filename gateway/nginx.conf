events {
    worker_connections 1024;
}

http {
    sendfile on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Frontend (Vite/React)
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Auth Service
        location /api/auth {
            proxy_pass http://auth-service:9094;
        }

        # Doctor Service
        location /api/doctors {
            proxy_pass http://doctor-service:9092;
        }

        # Patient Service
        location /api/patients {
            proxy_pass http://patient-service:9091;
        }

        # Appointment Service
        location /api/appointments {
            proxy_pass http://appointment-service:9093;
        }

        # Wearable Ingest Service
        location /api/wearable {
            proxy_pass http://ingest-wearables-service:9096;
        }

        # Health Alert Engine
        location /api/alerts {
            proxy_pass http://health-alert-engine:9097;
        }
    }
}
